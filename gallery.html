<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | Motherland Academy Nabweru</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Specific Gallery Styling */
        .gallery-section { padding: 40px 5%; text-align: center; }
        
        /* Video Container - Minimal Space */
        .video-box { 
            max-width: 600px; 
            margin: 20px auto; 
            border: 5px solid #004a99; 
            border-radius: 10px; 
            overflow: hidden;
            background: #000;
        }
        video { width: 100%; display: block; }

        /* Slideshow Styling */
        .slideshow-container {
            max-width: 800px;
            position: relative;
            margin: 40px auto;
            overflow: hidden;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .slides-wrapper {
            display: flex;
            transition: transform 0.8s ease-in-out;
        }
        .slide-item { min-width: 100%; }
        .slide-item img { width: 100%; height: 450px; object-fit: cover; }

        .video-btn { 
            background: #f4b400; border: none; padding: 10px 20px; 
            cursor: pointer; font-weight: bold; margin-top: 10px; border-radius: 5px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Motherland Academy</div>
        <nav id="main-nav">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="academics.html">Academics</a></li>
                <li><a href="gallery.html" class="active">Gallery</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="gallery-section">
        <h1>School Life in Action</h1>
        <p>Experience the vibrant environment of Motherland Academy Nabweru.</p>
        <div ><img src="images/SMILE.png " alt="Building"></div>

        <!-- 1. AUTOPLAY VIDEO (Minimal Space) -->
        <div class="video-box">
            <video id="schoolVideo" autoplay muted loop playsinline>
                <source src="images/MOTHERLAND.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>
        <button class="video-btn" onclick="toggleSound()">🔊 Unmute Video</button>

        <!-- 2. AUTOMATIC IMAGE SLIDESHOW -->
        <h2 style="margin-top:50px;">Campus Highlights</h2>
        
        <div class="slideshow-container">
            <div class="slides-wrapper" id="slider">
                <div class="slide-item"><img src="images/SMILE.png " alt="Building"></div>
                <div class="slide-item"><img src="images/FOOTBALL.png " alt="Building"></div>
                <div class="slide-item"><img src="images/STUDENTS.png" alt="Students"></div>
                <div class="slide-item"><img src="images/ADVERT.png" alt="Laboratory"></div>
                <div class="slide-item"><img src="images/COOKING.png " alt="Building"></div>
                <div class="slide-item"><img src="images/SPORTS.png " alt="Building"></div>
                <div class="slide-item"><img src="images/MEASUREMENTS.png " alt="Building"></div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2024 Motherland Academy Nabweru. All Rights Reserved.</p>
    </footer>

    <script>
        // Video Sound Toggle
        function toggleSound() {
            const video = document.getElementById('schoolVideo');
            const btn = document.querySelector('.video-btn');
            if (video.muted) {
                video.muted = false;
                btn.innerHTML = "🔈 Mute Sound";
            } else {
                video.muted = true;
                btn.innerHTML = "🔊 Unmute Video";
            }
        }

        // Automatic Slideshow Logic
        let currentSlide = 0;
        const slider = document.getElementById('slider');
        const totalSlides = document.querySelectorAll('.slide-item').length;

        function autoPlaySlides() {
            currentSlide++;
            if (currentSlide >= totalSlides) {
                currentSlide = 0;
            }
            slider.style.transform = `translateX(-${currentSlide * 100}%)`;
        }

        setInterval(autoPlaySlides, 3000); // Changes every 3 seconds
    </script>
</body>
</html>
